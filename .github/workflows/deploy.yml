name: Deploy green main

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  changes:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.app.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Detect production changes
        id: app
        run: |
          if git diff --quiet HEAD^ HEAD -- backend frontend firebase.json .firebaserc firestore.rules storage.rules; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: google-github-actions/auth@v3
        with:
          project_id: seewik
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Record rollback revision
        id: previous
        run: |
          revision="$(gcloud run services describe seewik-api --project seewik --region asia-south1 --format='value(status.latestReadyRevisionName)')"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Deploy backend candidate without traffic
        id: backend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: seewik-api
          project_id: seewik
          region: asia-south1
          source: ./backend
          tag: candidate-${{ github.run_number }}
          no_traffic: true
          env_vars: SEEWIK_GIT_SHA=${{ github.event.workflow_run.head_sha }}
          env_vars_update_strategy: merge
          flags: >-
            --max-instances=20
            --concurrency=80
            --timeout=300
            --memory=512Mi
            --cpu=1

      - name: Verify backend candidate
        run: |
          candidate_url="$(gcloud run services describe seewik-api --project seewik --region asia-south1 --format="value(status.traffic[?tag='candidate-${{ github.run_number }}'].url)")"
          test -n "$candidate_url"
          curl --fail --silent --show-error "$candidate_url/health"

      - name: Route traffic to candidate
        run: >-
          gcloud run services update-traffic seewik-api
          --project seewik
          --region asia-south1
          --to-tags candidate-${{ github.run_number }}=100

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend from the verified commit
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy frontend
        run: npx firebase-tools@15.28.2 deploy --only hosting --project seewik --non-interactive

      - name: Verify production routes
        run: |
          curl --fail --silent --show-error https://seewik-api-528138216934.asia-south1.run.app/health
          for route in / /report/new /reports /points /initiatives /initiatives/new; do
            curl --fail --silent --show-error --output /dev/null "https://seewik.web.app${route}"
          done

      - name: Remove temporary traffic tag
        run: >-
          gcloud run services update-traffic seewik-api
          --project seewik
          --region asia-south1
          --remove-tags candidate-${{ github.run_number }}

      - name: Restore previous healthy backend on failure
        if: failure() && steps.previous.outputs.revision != ''
        run: >-
          gcloud run services update-traffic seewik-api
          --project seewik
          --region asia-south1
          --to-revisions ${{ steps.previous.outputs.revision }}=100
