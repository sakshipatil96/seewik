name: Deploy green main

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  changes:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.app.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download the complete pushed commit range
        uses: actions/download-artifact@v8
        with:
          name: production-change-range
          path: ${{ runner.temp }}/production-change-range
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Detect production changes
        id: app
        run: |
          before_sha="$(tr -d '[:space:]' < "${{ runner.temp }}/production-change-range/before-sha")"
          after_sha="$(tr -d '[:space:]' < "${{ runner.temp }}/production-change-range/after-sha")"
          if ! [[ "$before_sha" =~ ^[0-9a-f]{40}$ && "$after_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The recorded push range is invalid." >&2
            exit 1
          fi
          if [[ "$after_sha" != "${{ github.event.workflow_run.head_sha }}" ]]; then
            echo "The tested commit does not match the deployment candidate." >&2
            exit 1
          fi
          if [[ "$before_sha" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${before_sha}^{commit}"; then
            echo "The beginning of the pushed range is unavailable; deploying conservatively." >&2
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$before_sha..$after_sha" -- backend frontend data/prabhags firebase.json .firebaserc firestore.rules storage.rules .github/workflows/quality.yml .github/workflows/deploy.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: google-github-actions/auth@v3
        with:
          project_id: seewik
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Record rollback revision
        id: previous
        run: |
          revision="$(gcloud run services describe seewik-api --project seewik --region asia-south1 --format='value(status.latestReadyRevisionName)')"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Deploy backend candidate without traffic
        id: backend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: seewik-api
          project_id: seewik
          region: asia-south1
          source: ./backend
          tag: candidate-${{ github.run_number }}
          no_traffic: true
          env_vars: SEEWIK_GIT_SHA=${{ github.event.workflow_run.head_sha }}
          env_vars_update_strategy: merge
          flags: >-
            --max-instances=20
            --concurrency=80
            --timeout=300
            --memory=512Mi
            --cpu=1

      - name: Verify backend candidate
        run: |
          candidate_url="$(gcloud run services describe seewik-api --project seewik --region asia-south1 --format='json(status.traffic)' | jq --raw-output '.status.traffic[] | select(.tag == "candidate-${{ github.run_number }}") | .url')"
          test -n "$candidate_url"
          curl --fail --silent --show-error "$candidate_url/health"

      - name: Route traffic to candidate
        run: >-
          gcloud run services update-traffic seewik-api
          --project seewik
          --region asia-south1
          --to-tags candidate-${{ github.run_number }}=100

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend from the verified commit
        working-directory: frontend
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          test -n "$VITE_GOOGLE_MAPS_API_KEY"
          npm ci
          npm run build

      - name: Deploy frontend, Firestore rules and Storage rules
        run: npx firebase-tools@15.28.2 deploy --only hosting,firestore:rules,storage --project seewik --non-interactive

      - name: Verify production routes
        run: |
          curl --fail --silent --show-error https://seewik-api-528138216934.asia-south1.run.app/health
          for route in / /report/new /reports /points /initiatives /initiatives/new /awareness /emergency; do
            curl --fail --silent --show-error --output /dev/null "https://seewik.web.app${route}"
          done

      - name: Remove temporary traffic tag
        run: >-
          gcloud run services update-traffic seewik-api
          --project seewik
          --region asia-south1
          --remove-tags candidate-${{ github.run_number }}

      - name: Restore previous healthy backend on failure
        if: failure() && steps.previous.outputs.revision != ''
        run: >-
          gcloud run services update-traffic seewik-api
          --project seewik
          --region asia-south1
          --to-revisions ${{ steps.previous.outputs.revision }}=100

      - name: Remove failed candidate traffic tag
        if: failure()
        run: >-
          gcloud run services update-traffic seewik-api
          --project seewik
          --region asia-south1
          --remove-tags candidate-${{ github.run_number }}
