name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Repository content policy
        run: bash scripts/check_repository_content.sh

      - name: Secret-safe diagnostics policy
        run: bash scripts/check_secret_safe_diagnostics.sh

      - name: Whitespace
        run: git show --check --format= HEAD

      - name: Boundary dataset integrity
        working-directory: data/prabhags
        run: shasum -a 256 -c official-map-digitized-boundaries-v0.2.sha256

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Backend tests and evaluation integrity
        working-directory: backend
        run: mvn -B test

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests, build and dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npm audit --audit-level=high

      - name: Firestore and Storage rules protection tests
        working-directory: frontend
        run: npm run test:rules:emulator

      - name: High-severity dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Record the complete pushed commit range
        if: github.event_name == 'push'
        run: |
          mkdir -p "${{ runner.temp }}/production-change-range"
          echo "${{ github.event.before }}" > "${{ runner.temp }}/production-change-range/before-sha"
          echo "${{ github.sha }}" > "${{ runner.temp }}/production-change-range/after-sha"

      - name: Preserve the pushed range for the green deployment workflow
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: production-change-range
          path: ${{ runner.temp }}/production-change-range
          retention-days: 1
